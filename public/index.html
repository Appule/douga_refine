<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stro-Fix ver2.1</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://unpkg.com/utif@2.0.1/UTIF.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
</head>

<body>

  <div id="window-global" class="window global-window"></div>
  <div id="window-config" class="window config-window"></div>
  <div id="window-frames" class="window frames-window"></div>

  <div class="container">
    <div class="top-container">
      <div class="main-editor-panel" id="drop-zone">
        <div class="editor-content">
          <h1>編集画面</h1>
          <p>
            「カットフォルダ」から作業フォルダを選択してください
          </p>
          <canvas id="canvas"></canvas>
          <canvas id="drawCanvas"></canvas>
          <canvas id="overlayCanvas"></canvas>
          <canvas id="offscreenCanvas"></canvas>
        </div>
        <div id="status"></div>
      </div>

      <div class="resizer-v"></div>
      <canvas id="previewCanvas" style="position:absolute; display:none; pointer-events:none; z-index:1000;"></canvas>

      <div class="frame-menu-panel">
        <div class="menu-header">
          <h3>フレームメニュー</h3>
        </div>
        <div class="menu-content">
        </div>
      </div>
    </div>

    <div class="resizer-h"></div>

    <div class="color-editor-panel" id="cfg-drop-zone">
      <div class="color-header">
        <h3 style="width: 430px; text-wrap-mode: nowrap; overflow: hidden;" id="color-editor-title">カラー編集 ⇒ <i
            class="fa-solid fa-globe"></i> グローバルコンフィグ</h3>
        <button style="width: 40px; height: 30px" class="tooltip" id="importColorsBtn">
          <i class="fas fa-file-import"></i>
          <span class="tooltip-text">コンフィグをインポート</span>
          <input type="file" id="configFileInput" style="display: none;" />
        </button>
        <button style="width: 40px; height: 30px" class="tooltip" id="exportColorsBtn">
          <i class="fas fa-file-export"></i>
          <span class="tooltip-text">コンフィグをエクスポート</span>
        </button>
        <input style="width: 300px; height: 30px; box-sizing: border-box; font-size: medium;" id="configFileNameInput">
        <button style="width: 40px; height: 30px" class="tooltip" id="clearFrameCfgBtn">
          <i class="fa-solid fa-square-minus"></i>
          <span class="tooltip-text">フレームコンフィグをクリア</span>
        </button>
      </div>
      <div class="color-content">
        <!-- background picker and color blocks are generated by script.js -->
      </div>
    </div>
  </div>
  <script>
    const ws = new WebSocket('ws://localhost:3000');
  </script>
  <script src="utils.js"></script>
  <script src="parts.js"></script>
  <script src="float-window.js"></script>
  <script src="canvas-editor.js"></script>
  <script src="frame-manager.js"></script>
  <script src="config-editor.js"></script>
  <script src="float-panel.js"></script>
  <script src="image-loader.js"></script>
  <script src="shader.js"></script>
  <script src="webgpu-processor.js"></script>
  <script src="core.js"></script>
</body>

</html>
